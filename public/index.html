<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSE + Redis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: white;

            padding: 32px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 24px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #999;
        }

        .status-indicator.connected {
            background: #22c55e;
        }

        .form {
            display: flex;
            gap: 10px;

            margin-bottom: 30px;
        }

        input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 10px;

            padding: 0;

            list-style: none;
        }

        .notification {
            padding: 14px;

            background: #f3f4f6;

            border-radius: 8px;

            border-left: 4px solid #111827;
        }

        .notification strong {
            display: block;

            margin-bottom: 4px;
        }

        .notification small {
            color: #6b7280;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Notificações SSE</h1>

        <div class="status">
            <span id="statusIndicator" class="status-indicator"></span>

            <span id="statusText">
                Conectando...
            </span>
        </div>

        <form id="notificationForm" class="form">

            <input id="messageInput" type="text" placeholder="Digite uma notificação..." autocomplete="off" required>

            <button type="submit">
                Enviar
            </button>

        </form>

        <h2>Notificações recebidas</h2>

        <ul id="notifications" class="notifications"></ul>

    </main>

    <script>
        // ========================================
        // ELEMENTOS HTML
        // ========================================

        const form =
            document.getElementById("notificationForm");

        const input =
            document.getElementById("messageInput");

        const notifications =
            document.getElementById("notifications");

        const statusText =
            document.getElementById("statusText");

        const statusIndicator =
            document.getElementById("statusIndicator");


        // ========================================
        // CONEXÃO SSE
        // ========================================

        const eventSource =
            new EventSource("/events");


        // ========================================
        // CONEXÃO ABERTA
        // ========================================

        eventSource.onopen = () => {

            console.log("Conexão SSE estabelecida.");

            statusText.textContent =
                "Conectado ao servidor";

            statusIndicator.classList.add(
                "connected"
            );
        };


        // ========================================
        // RECEBER EVENTOS
        // ========================================

        eventSource.onmessage = (event) => {

            console.log(
                "Evento recebido:",
                event.data
            );

            const data =
                JSON.parse(event.data);


            // ======================================
            // NOTIFICAÇÃO
            // ======================================

            if (data.type === "notification") {

                addNotification(data);
            }


            // ======================================
            // CONEXÃO
            // ======================================

            if (data.type === "connection") {

                console.log(
                    data.message
                );
            }
        };


        // ========================================
        // ERRO / RECONEXÃO
        // ========================================

        eventSource.onerror = (error) => {

            console.error(
                "Erro na conexão SSE:",
                error
            );

            statusText.textContent =
                "Conexão perdida. Tentando reconectar...";

            statusIndicator.classList.remove(
                "connected"
            );
        };


        // ========================================
        // ADICIONAR NOTIFICAÇÃO NA TELA
        // ========================================

        function addNotification(data) {

            const li =
                document.createElement("li");

            li.classList.add(
                "notification"
            );


            const strong =
                document.createElement("strong");

            strong.textContent =
                data.message;


            const small =
                document.createElement("small");

            small.textContent =
                new Date(
                    data.timestamp
                ).toLocaleString(
                    "pt-BR"
                );


            li.appendChild(strong);

            li.appendChild(small);

            notifications.prepend(li);
        }


        // ========================================
        // ENVIAR NOTIFICAÇÃO
        // ========================================

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const message =
                    input.value.trim();


                if (!message) {
                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/notify",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    message
                                })
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Erro ao enviar notificação."
                        );
                    }


                    input.value = "";

                    input.focus();

                } catch (error) {

                    console.error(error);

                    alert(
                        "Não foi possível enviar a notificação."
                    );
                }
            }
        );
    </script>

</body>

</html>
