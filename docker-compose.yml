services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sse-frontend

    ports:
      - "5500:80"

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sse-backend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL: notifications
      FRONTEND_URL: http://localhost:5500

    depends_on:
      - redis

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    container_name: sse-redis

    ports:
      - "6379:6379"

    restart: unless-stopped