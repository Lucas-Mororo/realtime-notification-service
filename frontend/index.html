<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSE + Redis Notifications</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f4f5;
            color: #18181b;
        }

        main {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            margin-top: 0;
            color: #71717a;
        }

        .status {
            margin: 24px 0;
            padding: 12px 16px;
            border-radius: 8px;
            background: #e4e4e7;
        }

        .status.connected {
            background: #dcfce7;
            color: #166534;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            background: #18181b;
            color: white;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            padding: 16px;
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
        }

        .notification strong {
            display: block;
            margin-bottom: 6px;
        }

        .notification small {
            color: #71717a;
        }
    </style>

</head>

<body>

    <main>

        <h1>Real-time Notifications</h1>

        <p class="description">
            Server-Sent Events + Express + Redis Pub/Sub
        </p>

        <div id="status" class="status">
            Conectando ao servidor...
        </div>

        <form id="notification-form">

            <input id="message" type="text" placeholder="Digite uma notificação..." autocomplete="off" required>

            <button type="submit">
                Enviar
            </button>

        </form>

        <div id="notifications" class="notifications"></div>

    </main>


    <script>

        // ========================================
        // CONFIGURAÇÃO
        // ========================================

        const API_URL =
            "http://localhost:3000";


        const statusElement =
            document.getElementById("status");

        const form =
            document.getElementById(
                "notification-form"
            );

        const messageInput =
            document.getElementById("message");

        const notificationsElement =
            document.getElementById(
                "notifications"
            );

        const USER_ID = "lucas";
        // ========================================
        // SSE
        // ========================================

        /**
         * EventSource mantém uma conexão HTTP
         * aberta com o endpoint SSE.
         *
         * Diferentemente de fetch comum,
         * a conexão permanece aberta aguardando
         * novos eventos enviados pelo servidor.
         */
        const eventSource =
            new EventSource(
                // `${API_URL}/events`
                `${API_URL}/events?userId=${USER_ID}`
            );


        // ========================================
        // CONEXÃO ESTABELECIDA
        // ========================================

        eventSource.onopen = () => {

            console.log(
                "[SSE] Conexão estabelecida."
            );

            statusElement.textContent =
                "Conectado ao servidor.";

            statusElement.className =
                "status connected";
        };


        // ========================================
        // MENSAGEM RECEBIDA
        // ========================================

        eventSource.addEventListener("notification", (event) => {

            console.log(
                "[SSE notification] Evento recebido :",
                event.data
            );

            try {

                const data =
                    JSON.parse(event.data);


                if (
                    data.type ===
                    "connection"
                ) {
                    return;
                }


                const notification =
                    document.createElement(
                        "div"
                    );

                notification.className =
                    "notification";


                const title =
                    document.createElement(
                        "strong"
                    );

                title.textContent =
                    data.message;


                const timestamp =
                    document.createElement(
                        "small"
                    );

                if (data.timestamp) {

                    timestamp.textContent =
                        new Date(
                            data.timestamp
                        ).toLocaleString(
                            "pt-BR"
                        );

                }


                notification.appendChild(
                    title
                );

                notification.appendChild(
                    timestamp
                );


                notificationsElement.prepend(
                    notification
                );

            } catch (error) {

                console.error(
                    "[SSE] Erro ao processar evento:",
                    error
                );
            }
        });


        // ========================================
        // ERRO / RECONEXÃO
        // ========================================

        eventSource.onerror = (error) => {

            console.error(
                "[SSE] Erro na conexão:",
                error
            );

            statusElement.textContent =
                "Conexão perdida. Tentando reconectar...";

            statusElement.className =
                "status disconnected";
        };


        // ========================================
        // ENVIAR NOTIFICAÇÃO
        // ========================================

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const message =
                    messageInput.value.trim();


                if (!message) {
                    return;
                }


                try {

                    const response =
                        await fetch(
                            `${API_URL}/notify`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",
                                },

                                body: JSON.stringify({
                                    message,
                                }),
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Erro ao enviar notificação."
                        );
                    }


                    console.log(
                        "[API] Notificação publicada:",
                        data
                    );


                    messageInput.value = "";

                    messageInput.focus();


                } catch (error) {

                    console.error(
                        "[API] Erro:",
                        error
                    );

                    alert(
                        "Não foi possível enviar a notificação."
                    );
                }

            }
        );


        // ========================================
        // ENCERRAMENTO
        // ========================================

        window.addEventListener(
            "beforeunload",
            () => {

                eventSource.close();

            }
        );

    </script>

</body>

</html>
