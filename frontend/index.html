<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSE + Redis Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f4f5;
            color: #18181b;
        }

        main {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            margin-top: 0;
            color: #71717a;
        }

        .room-info {
            margin-top: 20px;
            padding: 12px 16px;

            border-radius: 8px;

            background: #e4e4e7;

            font-size: 14px;
        }

        .status {
            margin: 24px 0;
            padding: 12px 16px;

            border-radius: 8px;

            background: #e4e4e7;
        }

        .status.connected {
            background: #dcfce7;
            color: #166534;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        form {
            display: flex;
            gap: 10px;

            margin-bottom: 24px;
        }

        input {
            flex: 1;

            padding: 12px;

            border: 1px solid #d4d4d8;
            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #18181b;
        }

        button {
            padding: 12px 20px;

            border: 0;
            border-radius: 8px;

            cursor: pointer;

            background: #18181b;
            color: white;

            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 500px;
            overflow-y: auto;
            padding: 10px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e4e4e7;
        }

        .auth-card,
        .chat-card {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .auth-grid {
            display: grid;
            gap: 12px;
        }

        .auth-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .secondary {
            background: #f4f4f5;
            color: #18181b;
        }

        .hidden {
            display: none;
        }

        .notification {
            padding: 16px;

            background: white;

            border: 1px solid #e4e4e7;
            border-radius: 8px;

            max-width: 75%;
        }

        .notification.mine {
            align-self: flex-end;

            background: #dcfce7;

            border-color: #86efac;
        }

        .notification.other {
            align-self: flex-start;

            background: white;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;

            margin-bottom: 8px;
        }

        .notification-user {
            font-weight: 700;
        }

        .notification-room {
            color: #71717a;
            font-size: 12px;
        }

        .notification-message {
            margin: 0 0 8px;

            word-break: break-word;
        }

        .notification small {
            color: #71717a;
        }
    </style>

</head>

<body>

    <main>

        <h1>Real-time Chat</h1>

        <p class="description">
            Server-Sent Events + Express + Redis Pub/Sub
        </p>

        <section id="auth-card" class="auth-card">
            <h2>Autenticação</h2>
            <div class="auth-grid">
                <input id="auth-name" type="text" placeholder="Nome" autocomplete="name">
                <input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" required>
                <input id="auth-password" type="password" placeholder="Senha" autocomplete="current-password" required>
                <div class="auth-actions">
                    <button id="register-button" type="button">Cadastrar</button>
                    <button id="login-button" type="button" class="secondary">Entrar</button>
                </div>
            </div>
        </section>

        <section id="chat-card" class="chat-card hidden">
            <div id="room-info" class="room-info">
                Carregando informações da sala...
            </div>

            <div id="status" class="status">
                Conectando ao servidor...
            </div>

            <form id="notification-form">
                <input id="message" type="text" placeholder="Digite uma mensagem..." autocomplete="off" maxlength="500"
                    required>
                <button id="send-button" type="submit">Enviar</button>
            </form>

            <div id="notifications" class="notifications"></div>
        </section>

    </main>

    <script>

        // ========================================
        // CONFIGURAÇÃO
        // ========================================

        const API_URL =
            "http://localhost:3000";


        // ========================================
        // ELEMENTOS DA INTERFACE
        // ========================================

        const statusElement =
            document.getElementById("status");

        const roomInfoElement =
            document.getElementById("room-info");

        const form =
            document.getElementById(
                "notification-form"
            );

        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("send-button");

        const notificationsElement =
            document.getElementById(
                "notifications"
            );

        const authCardElement =
            document.getElementById("auth-card");

        const chatCardElement =
            document.getElementById("chat-card");

        const authNameInput =
            document.getElementById("auth-name");

        const authEmailInput =
            document.getElementById("auth-email");

        const authPasswordInput =
            document.getElementById("auth-password");

        const registerButton =
            document.getElementById("register-button");

        const loginButton =
            document.getElementById("login-button");

        let user = null;
        let token = null;
        let eventSource = null;
        let ROOM_ID = "room-123";
        let USER_ID = "guest";

        function renderAuth() {
            if (user) {
                authCardElement.classList.add("hidden");
                chatCardElement.classList.remove("hidden");
                roomInfoElement.textContent =
                    `Usuário: ${user.name} (${user.email}) | Sala: ${ROOM_ID}`;
            } else {
                authCardElement.classList.remove("hidden");
                chatCardElement.classList.add("hidden");
            }
        }

        function clearMessages() {
            notificationsElement.innerHTML = "";
        }

        function appendMessage(data) {
            const notification = document.createElement("div");
            const isMine = data.userId === USER_ID;
            notification.className = isMine ? "notification mine" : "notification other";

            const header = document.createElement("div");
            header.className = "notification-header";

            const userElement = document.createElement("span");
            userElement.className = "notification-user";
            userElement.textContent = data.userId || "Usuário";

            const roomElement = document.createElement("span");
            roomElement.className = "notification-room";
            roomElement.textContent = data.roomId || "";

            header.appendChild(userElement);
            header.appendChild(roomElement);

            const messageElement = document.createElement("p");
            messageElement.className = "notification-message";
            messageElement.textContent = data.message || "";

            const timestamp = document.createElement("small");
            if (data.timestamp) {
                timestamp.textContent = new Date(data.timestamp).toLocaleString("pt-BR");
            }

            notification.appendChild(header);
            notification.appendChild(messageElement);
            notification.appendChild(timestamp);
            notificationsElement.appendChild(notification);
            notificationsElement.scrollTop = notificationsElement.scrollHeight;
        }

        async function loadRoomHistory() {
            if (!token) {
                return;
            }

            try {
                const response = await fetch(
                    `${API_URL}/rooms/${encodeURIComponent(ROOM_ID)}/messages`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`,
                        },
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Erro ao carregar histórico.");
                }

                clearMessages();

                for (const message of data.messages) {
                    appendMessage(message);
                }
            } catch (error) {
                console.error("[History] Erro:", error);
            }
        }

        function connectSse() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(
                `${API_URL}/events?userId=${encodeURIComponent(USER_ID)}&roomId=${encodeURIComponent(ROOM_ID)}`
            );

            eventSource.onopen = () => {
                statusElement.textContent = "Conectado ao servidor.";
                statusElement.className = "status connected";
            };

            eventSource.addEventListener("connection", (event) => {
                console.log("[SSE connection] Evento recebido:", event.data);
            });

            eventSource.addEventListener("notification", (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.roomId && data.roomId !== ROOM_ID) {
                        return;
                    }
                    appendMessage(data);
                } catch (error) {
                    console.error("[SSE] Erro ao processar evento:", error);
                }
            });

            eventSource.onerror = () => {
                statusElement.textContent = "Conexão perdida. Tentando reconectar...";
                statusElement.className = "status disconnected";
            };
        }

        async function authenticate(action) {
            const email = authEmailInput.value.trim();
            const password = authPasswordInput.value.trim();
            const name = authNameInput.value.trim();

            if (!email || !password) {
                alert("Informe e-mail e senha.");
                return;
            }

            const endpoint = action === "register" ? "/auth/register" : "/auth/login";
            const payload = action === "register"
                ? { name, email, password }
                : { email, password };

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Falha na autenticação.");
                }

                if (action === "login") {
                    token = data.token;
                    user = data.user;
                    USER_ID = user.userId;
                } else {
                    user = data;
                    USER_ID = user.userId;
                }

                renderAuth();
                await loadRoomHistory();
                connectSse();
            } catch (error) {
                console.error("[Auth] Erro:", error);
                alert(error.message);
            }
        }

        registerButton.addEventListener("click", () => authenticate("register"));
        loginButton.addEventListener("click", () => authenticate("login"));


        form.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                const message = messageInput.value.trim();

                if (!message || !user) {
                    alert("Entre na aplicação antes de enviar mensagens.");
                    return;
                }

                sendButton.disabled = true;

                try {
                    const response = await fetch(`${API_URL}/notify`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            ...(token ? { Authorization: `Bearer ${token}` } : {}),
                        },
                        body: JSON.stringify({
                            userId: USER_ID,
                            roomId: ROOM_ID,
                            message,
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || "Erro ao enviar mensagem.");
                    }

                    appendMessage({
                        userId: USER_ID,
                        roomId: ROOM_ID,
                        message,
                        timestamp: new Date().toISOString(),
                    });

                    messageInput.value = "";
                    messageInput.focus();
                } catch (error) {
                    console.error("[API] Erro:", error);
                    alert("Não foi possível enviar a mensagem.");
                } finally {
                    sendButton.disabled = false;
                }
            }
        );

        window.addEventListener("beforeunload", () => {
            if (eventSource) {
                eventSource.close();
            }
        });

    </script>

</body>

</html>
