<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSE + Redis Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f4f5;
            color: #18181b;
        }

        main {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            margin-top: 0;
            color: #71717a;
        }

        .room-info {
            margin-top: 20px;
            padding: 12px 16px;

            border-radius: 8px;

            background: #e4e4e7;

            font-size: 14px;
        }

        .status {
            margin: 24px 0;
            padding: 12px 16px;

            border-radius: 8px;

            background: #e4e4e7;
        }

        .status.connected {
            background: #dcfce7;
            color: #166534;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        form {
            display: flex;
            gap: 10px;

            margin-bottom: 24px;
        }

        input {
            flex: 1;

            padding: 12px;

            border: 1px solid #d4d4d8;
            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #18181b;
        }

        button {
            padding: 12px 20px;

            border: 0;
            border-radius: 8px;

            cursor: pointer;

            background: #18181b;
            color: white;

            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notifications {
            height: 500px;

            overflow-y: auto;

            padding: 10px;
        }

        .notification {
            padding: 16px;

            background: white;

            border: 1px solid #e4e4e7;
            border-radius: 8px;

            max-width: 75%;
        }

        .notification.mine {
            align-self: flex-end;

            background: #dcfce7;

            border-color: #86efac;
        }

        .notification.other {
            align-self: flex-start;

            background: white;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;

            margin-bottom: 8px;
        }

        .notification-user {
            font-weight: 700;
        }

        .notification-room {
            color: #71717a;
            font-size: 12px;
        }

        .notification-message {
            margin: 0 0 8px;

            word-break: break-word;
        }

        .notification small {
            color: #71717a;
        }
    </style>

</head>

<body>

    <main>

        <h1>Real-time Chat</h1>

        <p class="description">
            Server-Sent Events + Express + Redis Pub/Sub
        </p>

        <div id="room-info" class="room-info">
            Carregando informações da sala...
        </div>

        <div id="status" class="status">
            Conectando ao servidor...
        </div>

        <form id="notification-form">

            <input id="message" type="text" placeholder="Digite uma mensagem..." autocomplete="off" maxlength="500"
                required>

            <button id="send-button" type="submit">
                Enviar
            </button>

        </form>

        <div id="notifications" class="notifications"></div>

    </main>

    <script>

        // ========================================
        // CONFIGURAÇÃO
        // ========================================

        const API_URL =
            "http://localhost:3000";


        // ========================================
        // ELEMENTOS DA INTERFACE
        // ========================================

        const statusElement =
            document.getElementById("status");

        const roomInfoElement =
            document.getElementById("room-info");

        const form =
            document.getElementById(
                "notification-form"
            );

        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("send-button");

        const notificationsElement =
            document.getElementById(
                "notifications"
            );


        // ========================================
        // IDENTIDADE DO CLIENTE
        // ========================================

        /**
         * Os dados do usuário e da sala são
         * obtidos através dos parâmetros da URL.
         *
         * Exemplo:
         *
         * http://localhost:5500/
         *     ?userId=lucas
         *     &roomId=room-123
         *
         * userId:
         * Identifica quem está conectado.
         *
         * roomId:
         * Identifica a sala de chat.
         */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const USER_ID =
            params.get("userId") || "lucas";

        const ROOM_ID =
            params.get("roomId") || "room-123";


        console.log(
            "[Chat] Usuário:",
            USER_ID
        );

        console.log(
            "[Chat] Sala:",
            ROOM_ID
        );


        roomInfoElement.textContent =
            `Usuário: ${USER_ID} | Sala: ${ROOM_ID}`;


        // ========================================
        // SSE
        // ========================================

        /**
         * EventSource abre uma conexão persistente
         * com o endpoint SSE.
         *
         * Essa conexão permanece aberta para que
         * o servidor consiga enviar eventos para
         * o navegador em tempo real.
         *
         * O userId e o roomId são enviados na URL
         * para que o backend saiba:
         *
         * 1. Quem está conectado.
         * 2. Em qual sala está conectado.
         */

        const eventSource =
            new EventSource(
                `${API_URL}/events` +
                `?userId=${encodeURIComponent(USER_ID)}` +
                `&roomId=${encodeURIComponent(ROOM_ID)}`
            );


        // ========================================
        // CONEXÃO ESTABELECIDA
        // ========================================

        eventSource.onopen = () => {

            console.log(
                "[SSE] Conexão estabelecida."
            );

            statusElement.textContent =
                "Conectado ao servidor.";

            statusElement.className =
                "status connected";

        };


        // ========================================
        // EVENTO: CONNECTION
        // ========================================

        /**
         * O backend envia esse evento somente
         * quando a conexão SSE é estabelecida.
         *
         * Formato:
         *
         * event: connection
         * data: {...}
         */

        eventSource.addEventListener(
            "connection",
            (event) => {

                console.log(
                    "[SSE connection] Evento recebido:",
                    event.data
                );

            }
        );


        // ========================================
        // EVENTO: NOTIFICATION
        // ========================================

        /**
         * O backend envia mensagens utilizando
         * o evento SSE "notification".
         *
         * Fluxo:
         *
         * Frontend
         *     ↓
         * POST /notify
         *     ↓
         * Redis Publisher
         *     ↓
         * Redis
         *     ↓
         * Redis Subscriber
         *     ↓
         * SSE Connection Manager
         *     ↓
         * EventSource
         *     ↓
         * Este listener
         */

        eventSource.addEventListener(
            "notification",
            (event) => {

                console.log(
                    "[SSE notification] Evento recebido:",
                    event.data
                );

                try {

                    const data =
                        JSON.parse(
                            event.data
                        );


                    // ========================================
                    // FILTRO DE SALA
                    // ========================================

                    /**
                     * O backend deve enviar somente
                     * mensagens pertencentes à sala
                     * em que o cliente está conectado.
                     *
                     * Essa verificação no frontend
                     * funciona como uma segunda camada
                     * de segurança.
                     */

                    if (
                        data.roomId &&
                        data.roomId !== ROOM_ID
                    ) {

                        console.warn(
                            "[SSE] Mensagem ignorada. Sala diferente:",
                            data.roomId
                        );

                        return;
                    }


                    // ========================================
                    // CRIA ELEMENTO DA MENSAGEM
                    // ========================================

                    const notification =
                        document.createElement(
                            "div"
                        );

                    const isMine =
                        data.userId === USER_ID;

                    notification.className =
                        isMine
                            ? "notification mine"
                            : "notification other";

                    const header =
                        document.createElement(
                            "div"
                        );

                    header.className =
                        "notification-header";


                    const user =
                        document.createElement(
                            "span"
                        );

                    user.className =
                        "notification-user";

                    user.textContent =
                        data.userId || "Usuário";


                    const room =
                        document.createElement(
                            "span"
                        );

                    room.className =
                        "notification-room";

                    room.textContent =
                        data.roomId || "";


                    header.appendChild(user);

                    header.appendChild(room);


                    const message =
                        document.createElement(
                            "p"
                        );

                    message.className =
                        "notification-message";

                    message.textContent =
                        data.message || "";


                    const timestamp =
                        document.createElement(
                            "small"
                        );


                    if (data.timestamp) {

                        timestamp.textContent =
                            new Date(
                                data.timestamp
                            ).toLocaleString(
                                "pt-BR"
                            );

                    }


                    notification.appendChild(
                        header
                    );

                    notification.appendChild(
                        message
                    );

                    notification.appendChild(
                        timestamp
                    );


                    notificationsElement.appendChild(
                        notification
                    );

                    notificationsElement.scrollTop =
                        notificationsElement.scrollHeight;

                } catch (error) {

                    console.error(
                        "[SSE] Erro ao processar evento:",
                        error
                    );

                }

            }
        );


        // ========================================
        // ERRO / RECONEXÃO
        // ========================================

        /**
         * EventSource possui reconexão automática.
         *
         * Caso a conexão seja perdida,
         * o navegador tentará reconectar
         * automaticamente.
         */

        eventSource.onerror = (error) => {

            console.error(
                "[SSE] Erro na conexão:",
                error
            );

            statusElement.textContent =
                "Conexão perdida. Tentando reconectar...";

            statusElement.className =
                "status disconnected";

        };


        // ========================================
        // ENVIAR MENSAGEM
        // ========================================

        /**
         * O SSE é utilizado somente para receber
         * mensagens.
         *
         * Para enviar uma mensagem utilizamos
         * uma requisição HTTP POST normal.
         *
         * Fluxo:
         *
         * Formulário
         *     ↓
         * POST /notify
         *     ↓
         * Express
         *     ↓
         * Redis Publisher
         */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const message =
                    messageInput.value.trim();


                if (!message) {
                    return;
                }


                sendButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            `${API_URL}/notify`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",
                                },

                                body: JSON.stringify({
                                    userId: USER_ID,
                                    roomId: ROOM_ID,
                                    message,
                                }),
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Erro ao enviar mensagem."
                        );

                    }


                    console.log(
                        "[API] Mensagem publicada:",
                        data
                    );


                    messageInput.value = "";

                    messageInput.focus();

                } catch (error) {

                    console.error(
                        "[API] Erro:",
                        error
                    );

                    alert(
                        "Não foi possível enviar a mensagem."
                    );

                } finally {

                    sendButton.disabled =
                        false;

                }

            }
        );


        // ========================================
        // ENCERRAMENTO
        // ========================================

        /**
         * Fecha explicitamente a conexão SSE
         * quando o usuário abandona a página.
         */

        window.addEventListener(
            "beforeunload",
            () => {

                eventSource.close();

            }
        );

    </script>

</body>

</html>
